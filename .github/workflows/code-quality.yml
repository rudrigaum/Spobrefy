name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Detekt & SonarQube Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Detekt analysis
        id: detekt
        run: ./gradlew detekt
        continue-on-error: true

      - name: Generate Detekt report
        if: always()
        run: |
          if [ -f "build/reports/detekt/detekt.xml" ]; then
            echo "Detekt report generated successfully"
          fi

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonarqube
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        continue-on-error: true

      - name: Check Detekt results
        if: failure() && steps.detekt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Detekt found code quality issues')

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/

      - name: Fail if quality gate failed
        if: failure()
        run: |
          echo "❌ Code quality checks failed"
          echo "Please fix the issues reported above"
          exit 1
