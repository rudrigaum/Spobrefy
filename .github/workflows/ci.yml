name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run quality checks (Detekt)
        run: ./gradlew detekt

      - name: Build with Gradle
        run: ./gradlew build -x detekt

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            app/build/reports/

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew sonarqube
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''

      - name: Comment PR with build status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const jobStatus = '${{ job.status }}';
            const buildLogPath = 'build/reports/detekt/detekt.html';
            
            let comment = `## Build Status: ${jobStatus.toUpperCase()} ✅\n\n`;
            comment += `- **Build**: ${jobStatus}\n`;
            comment += `- **Tests**: ${jobStatus}\n`;
            comment += `- **Detekt**: Check details above\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
